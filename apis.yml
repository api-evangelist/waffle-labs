name: Waffle Labs
description: Waffle Labs, Inc. (Waffle Insurance) is a consumer InsurTech company and
  licensed digital insurance agency, founded at MIT and accelerated through Barclays
  Techstars and MIT Delta V. Waffle offers an all-in-one, mobile-first platform that
  lets consumers get quotes and bind coverage in under 90 seconds across renters,
  pet, home & auto, term life, personal cyber, and travel insurance in all 50 US
  states, partnering with vetted carriers rather than underwriting risk itself. The
  company also runs an embedded-insurance program that lets partners offer Waffle
  products through a no-code embed. Waffle is a consumer/partner product with no
  public developer program or API surface at this time; this profile captures its
  identity and web properties for the API Evangelist network.
